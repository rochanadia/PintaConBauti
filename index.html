<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pintá con Bauti</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <div class="contenedor">

        <h1>🎨 Pintá con Bauti</h1>

        <p class="subtitulo">
            ¡Elegí una aventura para empezar!
        </p>

        <div class="categorias">

            <button
                class="tarjetaCategoria disponible"
                data-categoria="huevos-sorpresa"
                type="button"
            >
                <span class="iconoCategoria">🥚</span>

                <span class="nombreCategoria">
                    Huevos Sorpresa
                </span>

                <span class="estadoCategoria">
                    Elegir dibujos
                </span>
            </button>

            <button
                class="tarjetaCategoria proximamente"
                type="button"
                disabled
            >
                <span class="iconoCategoria">🚜</span>

                <span class="nombreCategoria">
                    La Granja
                </span>

                <span class="estadoCategoria">
                    Próximamente
                </span>
            </button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
