<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Armá el rompecabezas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/rompecabezas.css">
</head>

<body class="rompecabezasNuevo">

    <main class="pantallaRompecabezas">

        <h1 class="tituloJuegoRompecabezas">
            Armá el rompecabezas
        </h1>

        <div class="zonaJuegoRompecabezas">

            <aside class="referenciaRompecabezas">

                <p>Así tiene que quedar:</p>

                <img
                    id="imagenReferencia"
                    src=""
                    alt="Imagen completa de referencia"
                    draggable="false"
                >

            </aside>

            <section class="juegoRompecabezas">

                <div
                    id="tableroRompecabezas"
                    class="tableroRompecabezas"
                ></div>

                <div
                    id="piezasRompecabezas"
                    class="piezasRompecabezas"
                ></div>

            </section>

        </div>

        <div class="accionesRompecabezas">

            <button
                id="mezclarRompecabezas"
                class="botonAccionRompecabezas botonMezclar"
                type="button"
            >
                🔀 Mezclar
            </button>

            <button
                id="volverGaleriaRompecabezas"
                class="botonAccionRompecabezas botonElegirOtro"
                type="button"
            >
                ⬅ Elegir otro
            </button>

        </div>

        <div
            id="mensajeRompecabezas"
            class="mensajeGuardado"
        >
            <div class="mensajeGuardadoContenido">

                <div class="mensajeEmoji">🎉</div>

                <h2>¡Muy bien, Bauti!</h2>

                <p>¡Completaste el rompecabezas!</p>

            </div>
        </div>

    </main>

    <script src="js/rompecabezas.js"></script>

</body>

</html>
