<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Pintá con Bauti</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="pantallaPintar">

        <h1>🎨 Pintá con Bauti</h1>

        <div class="editorPintura">

            <aside class="herramientas">

                <h3 class="tituloHerramientas">🛠️ Herramientas</h3>

                <div class="herramientasDibujo">

                    <button id="pincel" class="herramienta activa" type="button">
                        🖍️ Pincel
                    </button>

                    <button id="goma" class="herramienta" type="button">
                        🧽 Goma
                    </button>

                    <button id="balde" class="herramienta" type="button">
                        🎨 Rellenar
                    </button>

                </div>

                <h3 class="tituloHerramientas">🎨 Colores</h3>

                <div class="paleta" aria-label="Colores">

                    <button class="color activo" data-color="#ff3b30" style="background:#ff3b30"></button>
                    <button class="color" data-color="#ff2d55" style="background:#ff2d55"></button>
                    <button class="color" data-color="#ff9500" style="background:#ff9500"></button>
                    <button class="color" data-color="#ffcc00" style="background:#ffcc00"></button>
                    <button class="color" data-color="#34c759" style="background:#34c759"></button>
                    <button class="color" data-color="#64d2ff" style="background:#64d2ff"></button>
                    <button class="color" data-color="#007aff" style="background:#007aff"></button>
                    <button class="color" data-color="#af52de" style="background:#af52de"></button>

                    <button class="color" data-color="#8e5a2b" style="background:#8e5a2b"></button>
                    <button class="color" data-color="#111111" style="background:#111111"></button>
                    <button class="color" data-color="#8e8e93" style="background:#8e8e93"></button>
                    <button class="color" data-color="#ffffff" style="background:#ffffff"></button>
                    <button class="color" data-color="#b00020" style="background:#b00020"></button>
                    <button class="color" data-color="#003c8f" style="background:#003c8f"></button>
                    <button class="color" data-color="#006d3c" style="background:#006d3c"></button>
                    <button class="color" data-color="#6a1b9a" style="background:#6a1b9a"></button>

                    <button class="color" data-color="#ff9ecb" style="background:#ff9ecb"></button>
                    <button class="color" data-color="#ff6f00" style="background:#ff6f00"></button>
                    <button class="color" data-color="#fff176" style="background:#fff176"></button>
                    <button class="color" data-color="#7cb342" style="background:#7cb342"></button>
                    <button class="color" data-color="#81d4fa" style="background:#81d4fa"></button>
                    <button class="color" data-color="#1565c0" style="background:#1565c0"></button>
                    <button class="color" data-color="#8e24aa" style="background:#8e24aa"></button>
                    <button class="color" data-color="#a1887f" style="background:#a1887f"></button>

                </div>

                <h3 class="tituloHerramientas">📏 Tamaño</h3>

                <div class="grosores">

                    <button class="grosor" data-grosor="8">
                        Fino
                    </button>

                    <button class="grosor activo" data-grosor="18">
                        Medio
                    </button>

                    <button class="grosor" data-grosor="32">
                        Grande
                    </button>

                </div>

            </aside>

            <section class="zonaDibujo">

                <div class="contenedorLienzo">

                    <canvas id="lienzoPintura"></canvas>

                    <img
                        id="dibujo"
                        src=""
                        alt="Dibujo para pintar"
                        draggable="false"
                    >

                </div>

                <div class="accionesPintar">

                    <button id="deshacer" type="button" disabled>
                        ↩️ Deshacer
                    </button>

                    <button id="guardar" type="button">
                        💾 Guardar
                    </button>

                    <button id="limpiar" type="button">
                        🧹 Limpiar
                    </button>

                    <button id="volver" type="button">
                        ⬅ Volver
                    </button>

                </div>

            </section>

        </div>

    </main>

        <div id="mensajeGuardado" class="mensajeGuardado">
        <div class="mensajeGuardadoContenido">
            <div class="mensajeEmoji">🎉</div>

            <h2>¡Muy bien, Bauti!</h2>

            <p>Tu dibujo quedó guardado.</p>
        </div>
    </div>

    <script src="js/pintar.js"></script>

</body>
</html>
